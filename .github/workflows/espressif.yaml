# For development, trigger this on any push.
on:
  push:
    branches:
      - main
  pull_request:

name: Espressif

concurrency:
  group: espressif-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    name: Validation gate
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            src:
              - 'boot/espressif/**'
              - 'boot/bootutil/**'
              - 'boot/boot_serial/**'
              - 'boot/zcbor/**'
              - 'scripts/**'
      - id: decide
        run: |
          if [[ "${{ steps.filter.outputs.src }}" == "true" \
             || "${{ github.event_name == 'push' }}" == true ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  environment:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      matrix:
        targets: [esp32, esp32s2, esp32s3, esp32c2, esp32c3, esp32c5, esp32c6, esp32c61, esp32h2, esp32h4, esp32p4]
        features:
        - "secureboot-sign-rsa2048,secureboot-sign-rsa3072,secureboot-sign-ec256,secureboot-sign-ed25519"
        - "serialrecovery"
        include:
          - targets: esp32
            features: "multi-image,multi-boot"
            img: "multi"
          - targets: esp32s3
            features: "multi-image,multi-boot"
            img: "multi"
    runs-on: ubuntu-latest
    env:
      MCUBOOT_TARGETS: ${{ matrix.targets }}
      MCUBOOT_FEATURES: ${{ matrix.features }}
      MCUBOOT_IMG_NUM: ${{ matrix.img }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Print the environment
      run: |
        uname -a
        lscpu
        free
        pwd
    - name: Signed commit check
      if: ${{ github.event_name == 'pull_request' }}
      run: |
        ./ci/check-signed-off-by.sh
    - name: Espressif install
      run: |
        ./ci/espressif_install.sh
    - name: Espressif run
      run: |
        ./ci/espressif_run.sh
