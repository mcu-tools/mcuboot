on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: 42 3 * * *

name: Mynewt

concurrency:
  group: mynewt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    name: Validation gate
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            src:
              - 'boot/mynewt/**'
              - 'boot/bootutil/**'
              - 'testplan/**'
              - 'ci/**'
              - 'scripts/**'
      - id: decide
        run: |
          if [[ "${{ steps.filter.outputs.src }}" == "true" \
             || "${{ github.event_name == 'push' }}" == true ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  environment:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v7
      with:
        go-version: 'stable'
    - uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
          release: '15.2.Rel1'
    - name: Print the environment
      run: |
        uname -a
        lscpu
        free
        pwd
    - name: Native setup
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib
    - name: Install newt
      shell: bash
      run: |
        go version
        go install mynewt.apache.org/newt/newt@master
        newt version
    - name: Setup Mynewt
      shell: bash
      run: |
        newt new build
        cp -f ci/mynewt_project.yml build/project.yml
        cd build
        newt upgrade --shallow=1
        rm -rf repos/mcuboot
        git clone .. repos/mcuboot
    - name: Mynewt run
      shell: bash
      run: |
        cd build
        newt build $(ls ../ci/mynewt_targets | sed 's|^|@mcuboot/targets/|')
        newt test @mcuboot/boot/boot_serial
