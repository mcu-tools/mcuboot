on:
  push:
    branches:
      - main
      - v*-branch
  pull_request:

name: imgtool

concurrency:
  group: imgtool-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    name: Validation gate
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            src:
              - 'scripts/imgtool/**'
      - id: decide
        run: |
          if [[ "${{ steps.filter.outputs.src }}" == "true" \
             || "${{ github.event_name == 'push' }}" == true ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.11"]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pipenv'
        cache-dependency-path: |
          scripts/setup.py
    - name: Install dependencies
      run: |
        pip install --user pipenv
    - name: Run tests
      run: |
        cd scripts
        pipenv run pip install pytest -e .
        pipenv run pytest --junitxml=../junit/pytest-results-${{ matrix.python-version }}.xml
    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: |
          junit/pytest-results-${{ matrix.python-version }}*.xml
        if-no-files-found: ignore
        overwrite: true
  environment:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Cache pip
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip
    - name: Install packages
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        ./ci/imgtool_install.sh
    - name: Publish
      env:
        TWINE_TOKEN: ${{ secrets.TWINE_TOKEN }}
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        ./ci/imgtool_run.sh
