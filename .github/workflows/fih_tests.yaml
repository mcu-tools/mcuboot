on:
  push:
    branches:
      - main
  pull_request:

name: FIH hardening

concurrency:
  group: fih-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    name: Validation gate
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            src:
              - 'boot/bootutil/src/fault_injection_hardening_delay_rng_psa.c'
              - 'boot/bootutil/src/fault_injection_hardening_delay_rng_mbedtls.c'
              - 'boot/bootutil/src/fault_injection_hardening.c'
              - 'boot/bootutil/include/bootutil/fault_injection_hardening_delay_rng.h'
              - 'boot/bootutil/include/bootutil/fault_injection_hardening.h'
      - id: decide
        run: |
          if [[ "${{ steps.filter.outputs.src }}" == "true" \
             || "${{ github.event_name == 'push' }}" == true ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  config:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        fih_env:
        # FIH environment must use the following space separated format:
        #   BUILD_TYPE SKIP_SIZE DAMAGE_TYPE FIH_LEVEL(optional)
        - "RELEASE 2,4,6 SIGNATURE"
        - "RELEASE 2,4,6 SIGNATURE LOW"
        - "RELEASE 2,4,6 SIGNATURE MEDIUM"
        - "RELEASE 8,10 SIGNATURE"
        - "RELEASE 8,10 SIGNATURE LOW"
        - "RELEASE 8,10 SIGNATURE MEDIUM"
        - "MINSIZEREL 2,4,6 SIGNATURE"
        - "MINSIZEREL 2,4,6 SIGNATURE LOW"
        - "MINSIZEREL 2,4,6 SIGNATURE MEDIUM"
        - "MINSIZEREL 8,10 SIGNATURE"
        - "MINSIZEREL 8,10 SIGNATURE LOW"
        - "MINSIZEREL 8,10 SIGNATURE MEDIUM"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # Uses Mbed TLS from TFM, and nothing else from here.
        submodules: false
    - name: Print the environment
      run: |
        uname -a
        lscpu
        free
        pwd
    - name: Signed commit check
      if: ${{ github.event_name == 'pull_request' }}
      run: |
        ./ci/check-signed-off-by.sh
    - name: Authenticate to GH Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: FIH hardening test install
      env:
        CONTAINER_REGISTRY: ghcr.io/${{ github.repository_owner }}
      run: |
        ./ci/fih-tests_install.sh
    - name: FIH hardening test run
      env:
        FIH_ENV: ${{ matrix.fih_env }}
        CONTAINER_REGISTRY: ghcr.io/${{ github.repository_owner }}
      run: |
        ./ci/fih-tests_run.sh
